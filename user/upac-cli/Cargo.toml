[package]
name = "upac-cli"
description = "Package manager for installing any type of package in Linux, as well as registering binary file rollbacks based on composefs, written in Rust"
version.workspace = true

edition.workspace = true
rust-version.workspace = true

readme.workspace = true
homepage.workspace = true
repository.workspace = true

keywords.workspace = true
categories.workspace = true

license = "GPL-3.0-only"

[lints]
workspace = true

[[bin]]
name = "up"
path = "src/main.rs"

[dependencies]
upac-lib   = { workspace = true, optional = true, default-features = false }
upac-abi   = { workspace = true }
upac-types = { workspace = true }

libloading    = { workspace = true, optional = true }
colored       = { workspace = true }
anyhow        = { workspace = true }
serde         = { workspace = true }
clap          = { workspace = true }
toml          = { workspace = true }
sha2          = { workspace = true }
ctrlc         = { workspace = true }
indicatif     = { workspace = true }
i18n-embed    = { workspace = true }
i18n-embed-fl = { workspace = true }

strum = { version = "0.28.0", features = ["derive"] }
nix   = { version = "0.31.3", features = ["user"] }

chrono    = { version = "0.4" }
hex       = { version = "0.4" }

rust-embed = "8.12.0"

[build-dependencies]
toml = { workspace = true }

[features]
default = ["dynamic-plugins"]

dynamic-plugins = ["dep:libloading", "upac-lib?/dynamic-plugins"]
static-link     = ["dep:upac-lib"]

builtin-uki          = ["static-link", "upac-lib/builtin-uki"]
builtin-systemd-boot = ["static-link", "upac-lib/builtin-systemd-boot"]
builtin-grub         = ["static-link", "upac-lib/builtin-grub"]
builtin-refind       = ["static-link", "upac-lib/builtin-refind"]

builtin-alpm = ["static-link", "upac-lib/builtin-alpm"]
builtin-deb  = ["static-link", "upac-lib/builtin-deb"]
builtin-rpm  = ["static-link", "upac-lib/builtin-rpm"]
builtin-xbps = ["static-link", "upac-lib/builtin-xbps"]

builtin-all-booters  = ["static-link", "upac-lib/builtin-all-booters"]
builtin-all-decoders = ["static-link", "upac-lib/builtin-all-decoders"]
builtin-all          = ["static-link", "upac-lib/builtin-all"]
