[package]
name = "upac-refind"
description = "rEFInd boot plugin for upac: one-shot/persistent reboot selection via the PreviousBoot EFI variable"
version.workspace = true

edition.workspace = true
rust-version.workspace = true

license.workspace = true

readme.workspace = true
homepage.workspace = true
repository.workspace = true

keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[lib]
name = "upac_boot_refind"
crate-type = ["cdylib", "rlib"]

[dependencies]
upac-abi = { workspace = true }
upac-types = { workspace = true }

nix      = { workspace = true, features = ["ioctl"] }

efivar   = { workspace = true }
uuid     = { workspace = true }

[build-dependencies]
toml = { workspace = true }

[features]
default = []
cdylib = []
